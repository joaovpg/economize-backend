quarkus:
  default-locale: pt-BR
  locales: pt-BR
  datasource:
    db-kind: postgresql
  flyway:
    migrate-at-start: true
  hibernate-orm:
    schema-management:
      strategy: validate
  jackson:
    fail-on-unknown-properties: true
  smallrye-openapi:
    path: /q/openapi
    store-schema-directory: target/generated-openapi
  swagger-ui:
    path: /q/swagger-ui
    always-include: true
  log:
    console:
      format: "%d{HH:mm:ss} %-5p [%c] (traceId=%X{traceId} usuarioId=%X{usuarioId}) %s%e%n"
    category:
      "http-problem":
        level: WARN
  http:
    host: 0.0.0.0
    port: ${PORT:8080}
    cors:
      enabled: true
      origins: ${CORS_ORIGINS:http://localhost:5173}

mp:
  jwt:
    verify:
      issuer: economize

smallrye:
  jwt:
    new-token:
      issuer: economize
      lifespan: ${JWT_EXPIRACAO_SEGUNDOS:900}

economize:
  logging:
    threshold-millis: ${LOG_LIMITE_REQUISICAO_LENTA:1000}

"%test":
  quarkus:
    datasource:
      devservices:
        enabled: true
    hibernate-orm:
      schema-management:
        strategy: validate

"%dev":
  quarkus:
    datasource:
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      jdbc:
        url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_DB}

"%prod":
  quarkus:
    log:
      console:
        json:
          enabled: true
    datasource:
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      jdbc:
        url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_DB}
    http:
      proxy:
        proxy-address-forwarding: true
        allow-x-forwarded: true
        enable-forwarded-host: true
  mp:
    jwt:
      verify:
        publickey: ${JWT_CHAVE_PUBLICA}

  smallrye:
    jwt:
      sign:
        key: ${JWT_CHAVE_PRIVADA}
